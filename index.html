<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>After Paris</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --red: #EF4444;
      --red-dark: #DC2626;
      --blue: #3B82F6;
      --gray: #D1D5DB;
      --ink: #1F2937;
    }

    body {
      background:
        radial-gradient(circle at top left, #FEE2E2 0%, transparent 34%),
        radial-gradient(circle at top right, #DBEAFE 0%, transparent 38%),
        linear-gradient(180deg, #F8FAFC 0%, #EEF2F7 100%);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
    }

    .soft-card {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #E5E7EB;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.06);
    }

    .active-day {
      background: linear-gradient(135deg, var(--red), var(--red-dark));
      color: white;
      border-color: transparent;
      box-shadow: 0 12px 24px rgba(239, 68, 68, 0.28);
    }

    .input-box {
      border-radius: 18px;
      border: 1px solid #E5E7EB;
      background: #F9FAFB;
      padding: 12px 16px;
      transition: 0.2s;
    }

    .input-box:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }
  </style>
</head>

<body class="text-neutral-900">
  <div id="app"></div>

  <script>
    const days = [
      {
        day: 1,
        label: "광양 · 여수",
        x: 44,
        y: 78,
        note: "전라도 Day 1",
        schedule: ["광양 출발", "여수 이동", "해상 케이블카", "여수 밤바다"],
        food: ["게장", "서대회", "해산물", "낭만포차"],
        stay: "어딘가",
        photo: "https://images.unsplash.com/photo-1519046904884-53103b34b206?auto=format&fit=crop&w=1200&q=80"
      },
      {
        day: 2,
        label: "목포",
        x: 15,
        y: 80,
        note: "전라도 Day 2",
        schedule: ["목포 이동", "유달산", "해상 케이블카", "항구 산책"],
        food: ["세발낙지", "홍어삼합", "해산물"],
        stay: "어딘가",
        photo: "https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80"
      },
      {
        day: 3,
        label: "전주 · 보령",
        x: 31,
        y: 54,
        note: "충청도 Day 1",
        schedule: ["전주 한옥마을", "보령 이동", "대천해수욕장", "노을 보기"],
        food: ["전주비빔밥", "콩나물국밥", "조개구이", "해물칼국수"],
        stay: "어딘가",
        photo: "https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1200&q=80"
      },
      {
        day: 4,
        label: "수원",
        x: 29,
        y: 30,
        note: "경기권 Day 1",
        schedule: ["수원 이동", "수원 화성", "행궁동 산책"],
        food: ["수원왕갈비", "통닭거리", "카페"],
        stay: "어딘가",
        photo: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80"
      },
      {
        day: 5,
        label: "가평",
        x: 42,
        y: 22,
        note: "경기권 Day 2",
        schedule: ["가평 이동", "남이섬", "아침고요수목원", "드라이브"],
        food: ["닭갈비", "막국수", "카페"],
        stay: "어딘가",
        photo: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80"
      },
      {
        day: 6,
        label: "속초",
        x: 68,
        y: 10,
        note: "강원도 Day 1",
        schedule: ["속초 이동", "중앙시장", "영금정", "바다 산책"],
        food: ["닭강정", "오징어순대", "물회"],
        stay: "어딘가",
        photo: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80"
      },
      {
        day: 7,
        label: "강릉",
        x: 70,
        y: 20,
        note: "강원도 Day 2",
        schedule: ["강릉 이동", "안목해변", "커피거리", "경포대"],
        food: ["초당순두부", "장칼국수", "해산물"],
        stay: "어딘가",
        photo: "https://images.unsplash.com/photo-1519046904884-53103b34b206?auto=format&fit=crop&w=1200&q=80"
      },
      {
        day: 8,
        label: "안동",
        x: 65,
        y: 47,
        note: "경상도 Day 1",
        schedule: ["안동 이동", "하회마을", "월영교", "마무리 저녁"],
        food: ["안동찜닭", "간고등어", "한식"],
        stay: "어딘가",
        photo: "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1200&q=80"
      },
      {
        day: 9,
        label: "경주",
        x: 75,
        y: 64,
        note: "경상도 Day 2",
        schedule: ["경주 이동", "황리단길", "첨성대", "동궁과 월지"],
        food: ["십원빵", "황남빵", "한식"],
        stay: "어딘가",
        photo: "https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=1200&q=80"
      },
      {
        day: 10,
        label: "부산",
        x: 69,
        y: 77,
        note: "경상도 Day 3",
        schedule: ["부산 이동", "해운대", "광안리", "야경 보기"],
        food: ["돼지국밥", "밀면", "회"],
        stay: "어딘가",
        photo: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80"
      }
    ];

    let selectedDay = 1;
    const people = ["현호", "정영", "도겸", "현창"];

    const expenses = {};
    days.forEach((day) => {
      expenses[day.day] = {};
      people.forEach((person) => {
        expenses[day.day][person] = "";
      });
    });

    function getDayTotal(day) {
      return people.reduce((sum, person) => {
        return sum + (Number(expenses[day][person]) || 0);
      }, 0);
    }

    function updateExpense(day, person, value) {
      expenses[day][person] = value;
      const totalEl = document.getElementById(`total-${day}`);
      if (totalEl) totalEl.innerText = "₩ " + getDayTotal(day).toLocaleString();
    }

    function createMapLabels() {
      return days.map((item) => {
        const isPassed = selectedDay >= item.day;
        return `
          <g>
            <circle
              cx="${item.x}"
              cy="${item.y}"
              r="${isPassed ? 2.8 : 2.1}"
              fill="${isPassed ? "#EF4444" : "#D1D5DB"}"
              stroke="#ffffff"
              stroke-width="1"
            />
            <text
              x="${item.x + 3.2}"
              y="${item.y - 2.1}"
              font-size="3"
              font-weight="800"
              fill="#1F2937"
              stroke="#ffffff"
              stroke-width="4"
              paint-order="stroke"
              stroke-linejoin="round"
            >
              ${item.label}
            </text>
          </g>
        `;
      }).join("");
    }

    function createProgress() {
      const percent = ((selectedDay - 1) / (days.length - 1)) * 100;

      return `
        <div class="glass-card rounded-[30px] p-5">
          <div class="mb-4 flex items-center justify-between">
            <div>
              <p class="text-[10px] uppercase tracking-[0.28em] text-neutral-500 font-bold">Progress</p>
              <h3 class="mt-1 text-lg font-bold">Day ${selectedDay} of ${days.length}</h3>
            </div>
            <div class="rounded-full bg-blue-50 px-3 py-1 text-xs font-bold text-blue-600">
              ${Math.round(percent)}%
            </div>
          </div>

          <div class="relative h-3 rounded-full bg-neutral-200 overflow-hidden">
            <div
              class="absolute left-0 top-0 h-full rounded-full bg-gradient-to-r from-blue-400 to-blue-600"
              style="width:${percent}%"
            ></div>
          </div>

          <div class="mt-4 grid grid-cols-10 gap-1">
            ${days.map((item) => `
              <button
                onclick="selectDay(${item.day})"
                class="h-2 rounded-full transition ${
                  item.day <= selectedDay ? "bg-red-500" : "bg-neutral-300"
                }"
              ></button>
            `).join("")}
          </div>
        </div>
      `;
    }

    function createDayButtons() {
      return days.map((item) => `
        <button
          onclick="selectDay(${item.day})"
          class="shrink-0 rounded-full border px-4 py-2 text-sm font-bold transition ${
            selectedDay === item.day
              ? "active-day"
              : "border-neutral-200 bg-white/80 text-neutral-700 shadow-sm"
          }"
        >
          Day ${item.day}
        </button>
      `).join("");
    }

    function createRouteOverview() {
      return days.map((item) => `
        <button
          onclick="selectDay(${item.day})"
          class="flex w-full items-center justify-between rounded-2xl border px-4 py-3 text-left transition ${
            item.day === selectedDay
              ? "border-red-400 bg-red-50 text-red-600"
              : item.day < selectedDay
              ? "border-blue-200 bg-blue-50 text-blue-700"
              : "border-neutral-200 bg-white text-neutral-700"
          }"
        >
          <span class="font-bold">Day ${item.day}</span>
          <span class="text-sm font-medium opacity-80">${item.label}</span>
        </button>
      `).join("");
    }

    function createExpenseTab(activeStop) {
      return `
        <div class="soft-card rounded-[30px] p-5">
          <div class="mb-4 flex items-center justify-between gap-3">
            <div>
              <p class="text-[10px] uppercase tracking-[0.28em] text-neutral-500 font-bold">Split Bill</p>
              <h3 class="mt-1 text-xl font-extrabold">Day ${activeStop.day} 정산</h3>
            </div>
            <div
              id="total-${activeStop.day}"
              class="rounded-2xl bg-red-50 px-4 py-2 text-sm font-extrabold text-red-600"
            >
              ₩ ${getDayTotal(activeStop.day).toLocaleString()}
            </div>
          </div>

          <div class="space-y-3">
            ${people.map((person) => `
              <div class="flex items-center gap-3">
                <label class="w-14 text-sm font-bold text-neutral-700">${person}</label>
                <input
                  type="number"
                  inputmode="numeric"
                  placeholder="0"
                  value="${expenses[activeStop.day][person]}"
                  oninput="updateExpense(${activeStop.day}, '${person}', this.value)"
                  class="input-box w-full text-sm"
                />
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function render() {
      const activeStop = days.find((item) => item.day === selectedDay);
      const routePoints = days.map((item) => `${item.x},${item.y}`).join(" ");

      document.getElementById("app").innerHTML = `
        <div class="mx-auto w-full max-w-md min-h-screen px-4 pt-6 pb-10">

          <div class="mb-6">
            <div class="inline-flex items-center gap-2 rounded-full bg-white/80 px-3 py-1 text-[11px] font-bold text-neutral-600 shadow-sm">
              🚗 Korea Road Trip
            </div>

            <h1 class="mt-3 text-4xl font-black tracking-tight text-neutral-900">
              After Paris
            </h1>

            <p class="mt-2 text-sm leading-relaxed text-neutral-600">
              광양 출발 · 10일 전국 로드트립 플랜
            </p>

            <div class="mt-4 grid grid-cols-3 gap-2">
              <div class="rounded-2xl bg-white/75 p-3 text-center shadow-sm">
                <p class="text-xl font-black text-red-500">10</p>
                <p class="text-[11px] font-bold text-neutral-500">Days</p>
              </div>
              <div class="rounded-2xl bg-white/75 p-3 text-center shadow-sm">
                <p class="text-xl font-black text-blue-500">9+</p>
                <p class="text-[11px] font-bold text-neutral-500">Cities</p>
              </div>
              <div class="rounded-2xl bg-white/75 p-3 text-center shadow-sm">
                <p class="text-xl font-black text-neutral-800">4</p>
                <p class="text-[11px] font-bold text-neutral-500">People</p>
              </div>
            </div>
          </div>

          <div class="mb-4 -mx-1 overflow-x-auto pb-1">
            <div class="flex gap-2 px-1 min-w-max">
              ${createDayButtons()}
            </div>
          </div>

          <div class="space-y-4">
            ${createProgress()}

            <div class="glass-card rounded-[32px] p-4">
              <div class="mb-4 flex items-start justify-between gap-3">
                <div>
                  <p class="text-[10px] uppercase tracking-[0.28em] text-neutral-500 font-bold">Map</p>
                  <h2 class="mt-1 text-xl font-extrabold">Day ${activeStop.day} · ${activeStop.label}</h2>
                </div>
                <div class="rounded-full bg-blue-50 px-3 py-1 text-[11px] font-bold text-blue-600">
                  Live Route
                </div>
              </div>

              <div class="relative rounded-[30px] border border-neutral-200 bg-white aspect-[3/4] overflow-hidden shadow-inner">
                <img
                  src="./korea-detailed-map.png"
                  alt="Korea detailed map"
                  class="absolute inset-0 h-full w-full object-fill select-none pointer-events-none opacity-95"
                />

                <svg
                  viewBox="0 0 100 100"
                  preserveAspectRatio="none"
                  class="absolute inset-0 h-full w-full"
                >
                  <polyline
                    points="${routePoints}"
                    fill="none"
                    stroke="#3B82F6"
                    stroke-width="1.8"
                    stroke-dasharray="4 3"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    opacity="0.8"
                  />

                  ${createMapLabels()}
                </svg>

                <div
                  class="absolute z-20 transition-all duration-700 ease-in-out"
                  style="left:${activeStop.x}%; top:${activeStop.y}%; transform: translate(-50%, -50%);"
                >
                  <div class="relative h-10 w-10">
                    <div class="absolute inset-0 rounded-full bg-white/90 blur-sm"></div>
                    <svg viewBox="0 0 24 24" class="relative h-10 w-10 drop-shadow-lg">
                      <path d="M5 13h14l-1.2-3.3c-.3-.9-1.1-1.5-2-1.5H8.2c-.9 0-1.7.6-2 1.5L5 13Z" fill="#DC2626" />
                      <rect x="4" y="13" width="16" height="4" rx="1.5" fill="#DC2626" />
                      <circle cx="7" cy="18" r="1.8" fill="#991B1B" />
                      <circle cx="17" cy="18" r="1.8" fill="#991B1B" />
                      <circle cx="7" cy="18" r="0.7" fill="#fafafa" />
                      <circle cx="17" cy="18" r="0.7" fill="#fafafa" />
                      <rect x="9" y="9.5" width="6" height="2.2" rx="0.5" fill="#fafafa" opacity="0.95" />
                    </svg>
                  </div>
                </div>
              </div>
            </div>

            <div class="soft-card rounded-[32px] p-5 overflow-hidden">
              <div class="mb-4 flex items-center justify-between gap-3">
                <div>
                  <p class="text-[10px] uppercase tracking-[0.28em] text-neutral-500 font-bold">Current Stop</p>
                  <h3 class="mt-1 text-2xl font-black">Day ${activeStop.day}</h3>
                  <p class="text-base font-bold text-neutral-700">${activeStop.label}</p>
                </div>
                <div class="rounded-2xl bg-neutral-100 px-3 py-2 text-xs font-bold text-neutral-600 text-right max-w-[130px]">
                  ${activeStop.note}
                </div>
              </div>

              <div class="mb-5 overflow-hidden rounded-[26px] border border-neutral-200 aspect-[4/3] bg-neutral-100">
                <img src="${activeStop.photo}" alt="${activeStop.label}" class="h-full w-full object-cover" />
              </div>

              <div class="space-y-5">
                <div>
                  <h4 class="mb-2 text-sm font-black">오늘 일정</h4>
                  <div class="space-y-2">
                    ${activeStop.schedule.map((item) => `
                      <div class="rounded-2xl border border-neutral-200 bg-neutral-50 px-4 py-3 text-sm font-medium text-neutral-700">
                        ${item}
                      </div>
                    `).join("")}
                  </div>
                </div>

                <div>
                  <h4 class="mb-2 text-sm font-black">먹을 것</h4>
                  <div class="flex flex-wrap gap-2">
                    ${activeStop.food.map((item) => `
                      <span class="rounded-full bg-blue-50 px-3 py-2 text-xs font-bold text-blue-600">
                        ${item}
                      </span>
                    `).join("")}
                  </div>
                </div>

                <div>
                  <h4 class="mb-2 text-sm font-black">숙소</h4>
                  <div class="rounded-2xl border border-neutral-200 bg-red-50 px-4 py-3 text-sm font-bold text-red-600">
                    ${activeStop.stay}
                  </div>
                </div>
              </div>
            </div>

            ${createExpenseTab(activeStop)}

            <div class="soft-card rounded-[30px] p-4">
              <p class="mb-3 text-[10px] uppercase tracking-[0.28em] text-neutral-500 font-bold">Route Timeline</p>
              <div class="space-y-2">
                ${createRouteOverview()}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function selectDay(day) {
      selectedDay = day;
      render();
    }

    render();
  </script>
</body>
</html>
